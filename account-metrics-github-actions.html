<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account-Wide Metrics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            gap: 0;
        }

        /* LEFT SIDE - METRICS */
        .metrics-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            overflow-y: auto;
            box-shadow: -2px 0 15px rgba(0, 0, 0, 0.1);
        }

        .metrics-panel h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }

        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .metric-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-card .value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .metric-card .subtext {
            font-size: 12px;
            opacity: 0.8;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .metrics-grid .metric-card {
            margin-bottom: 0;
        }

        .account-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .account-info p {
            color: #333;
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.6;
        }

        .account-info strong {
            color: #667eea;
        }

        .account-info a {
            color: #667eea;
            text-decoration: none;
        }

        .account-info a:hover {
            text-decoration: underline;
        }

        .repo-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .repo-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 8px;
            border-left: 3px solid #667eea;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .repo-item:hover {
            background: #e9ecef;
            border-left-color: #764ba2;
            transform: translateX(5px);
        }

        .repo-item a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .repo-item .name {
            color: #667eea;
            font-weight: 600;
        }

        .repo-item .desc {
            color: #666;
            font-size: 11px;
            margin-top: 4px;
            max-height: 2.2em;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .repo-item .stats {
            color: #999;
            font-size: 11px;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #667eea;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        .timestamp {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        /* RIGHT SIDE - CONTENT */
        .content-panel {
            background: white;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .content-panel h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .user-profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .user-profile img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid #667eea;
        }

        .user-profile .name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .user-profile .username {
            font-size: 16px;
            color: #999;
            margin-bottom: 10px;
        }

        .user-profile .bio {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .user-profile .meta {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
            color: #666;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
            max-width: 500px;
            width: 100%;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-box .label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .metrics-panel {
                min-height: 50vh;
                box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            }

            .content-panel {
                min-height: 50vh;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .stats-summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LEFT SIDE - METRICS -->
        <div class="metrics-panel">
            <h1>📊 Account Metrics</h1>
            <div id="metricsContainer" class="loading">
                Loading metrics...
            </div>
        </div>

        <!-- RIGHT SIDE - CONTENT -->
        <div class="content-panel">
            <div id="contentContainer">
                <h2>🌟 Your GitHub Dashboard</h2>
                <p>Loading your profile...</p>
            </div>
        </div>
    </div>

    <script>
        async function loadMetrics() {
            try {
                const response = await fetch('./data/metrics.json');
                
                if (!response.ok) {
                    throw new Error('Metrics file not found. Please run the GitHub Action to generate metrics first.');
                }
                
                const metrics = await response.json();
                displayMetrics(metrics);
                displayProfile(metrics);
            } catch (error) {
                displayError(`Error: ${error.message}`);
                console.error('Error loading metrics:', error);
            }
        }

        function displayMetrics(metrics) {
            const container = document.getElementById('metricsContainer');
            const stats = metrics.statistics;
            const languages = metrics.languages;
            
            const topLanguages = Object.entries(languages)
                .slice(0, 5)
                .map(([lang, count]) => `${lang} (${count})`)
                .join(', ') || 'Not specified';

            const topRepos = metrics.top_repositories || [];
            const generatedAt = new Date(metrics.generated_at).toLocaleString();

            let html = `
                <div class="account-info">
                    <p><strong>User:</strong> ${metrics.user.name} (<a href="${metrics.user.profile_url}" target="_blank">@${metrics.user.login}</a>)</p>
                    <p><strong>Bio:</strong> ${metrics.user.bio}</p>
                    <p><strong>Location:</strong> ${metrics.user.location}</p>
                    <p><strong>Followers:</strong> ${metrics.user.followers} | <strong>Following:</strong> ${metrics.user.following}</p>
                </div>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <h3>📦 Total Repos</h3>
                        <div class="value">${stats.total_repositories}</div>
                        <div class="subtext">${stats.public_repositories} public, ${stats.private_repositories} private</div>
                    </div>
                    <div class="metric-card">
                        <h3>⭐ Total Stars</h3>
                        <div class="value">${stats.total_stars}</div>
                        <div class="subtext">Across all repos</div>
                    </div>
                    <div class="metric-card">
                        <h3>🔀 Total Forks</h3>
                        <div class="value">${stats.total_forks}</div>
                        <div class="subtext">Repository forks</div>
                    </div>
                    <div class="metric-card">
                        <h3>👁️ Total Watchers</h3>
                        <div class="value">${stats.total_watchers}</div>
                        <div class="subtext">Across all repos</div>
                    </div>
                    <div class="metric-card">
                        <h3>🐛 Open Issues</h3>
                        <div class="value">${stats.total_issues}</div>
                        <div class="subtext">Total across repos</div>
                    </div>
                    <div class="metric-card">
                        <h3>💻 Languages</h3>
                        <div class="value">${stats.total_languages}</div>
                        <div class="subtext">Different languages</div>
                    </div>
                </div>

                <div class="account-info">
                    <p><strong>Top Languages:</strong> ${topLanguages}</p>
                </div>

                <div class="account-info">
                    <p><strong>Top Repositories (by Stars):</strong></p>
                    <div class="repo-list">
                        ${topRepos.map(repo => `
                            <div class="repo-item">
                                <a href="${repo.url}" target="_blank">
                                    <div class="name">${repo.name}</div>
                                    <div class="desc">${repo.description}</div>
                                    <div class="stats">⭐ ${repo.stars} | 🔀 ${repo.forks} | 👁️ ${repo.watchers}</div>
                                </a>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="timestamp">Last updated: ${generatedAt}</div>
            `;

            container.innerHTML = html;
        }

        function displayProfile(metrics) {
            const container = document.getElementById('contentContainer');
            const stats = metrics.statistics;
            const user = metrics.user;

            let html = `
                <div class="user-profile">
                    <img src="${user.avatar_url}" alt="${user.login}">
                    <div class="name">${user.name}</div>
                    <div class="username">@${user.login}</div>
                    <div class="bio">${user.bio}</div>
                    <div class="meta">
                        <span>📍 ${user.location}</span>
                        <span>👥 ${user.followers} followers</span>
                    </div>
                </div>

                <div class="stats-summary">
                    <div class="stat-box">
                        <div class="number">${stats.total_repositories}</div>
                        <div class="label">Total Repos</div>
                    </div>
                    <div class="stat-box">
                        <div class="number">${stats.total_stars}</div>
                        <div class="label">Total Stars</div>
                    </div>
                </div>

                <div class="action-buttons">
                    <a href="https://github.com/${user.login}" target="_blank" class="btn btn-primary">View GitHub Profile</a>
                    <button class="btn btn-secondary" onclick="location.reload()">🔄 Refresh</button>
                </div>
            `;

            container.innerHTML = html;
        }

        function displayError(message) {
            const container = document.getElementById('metricsContainer');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        // Load metrics on page load
        loadMetrics();
    </script>
</body>
</html>
